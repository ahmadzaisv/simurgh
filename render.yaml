# Render Blueprint.
#   simurgh            the website (static, the files in site/)
#   simurgh-download   the download server (server/server.mjs): download keys -> the installer, and the installed
#                      app's updates. Its disk keeps the key hashes, who used which key, and the release files.
#                      Nothing secret is configured here: the owner's PC signs its requests (server/owner-public.pem).
services:
  - name: simurgh
    type: web
    runtime: static
    buildCommand: echo "static site - nothing to build"
    staticPublishPath: ./site
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - source: /download
        destination: /#download
        type: redirect

  - name: simurgh-download
    type: web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: echo "plain Node - nothing to install"
    startCommand: node server/server.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SITE_ORIGINS
        value: https://simurgh.onrender.com
    disk:
      name: simurgh-download-data
      mountPath: /var/data
      sizeGB: 1
